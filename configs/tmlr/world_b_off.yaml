# Paired study - world B, hidden coupling OFF.
# World B = world A with one changed outcome mechanism: the channel effects depend on the
# delinquency stage (oracle.channel_effects / channel_effects_late below). Confounding
# strength, hidden-factor weights, discount response, noise, eps and the behaviour
# policy (and its coupling switch, see world A) are those of world A. The hazard was set once for world B in development
# (dev seeds only, coupling on) and is shared by both coupling settings.
seed: 42
population:
  borrowers: 1000000
  loans_per_borrower:
  - 1
  - 1
panel:
  months: 24
demographics:
  age_mean: 42
  age_std: 13
  age_min: 18
  age_max: 78
  gender_weights:
    female: 0.49
    male: 0.49
    non_binary: 0.01
    not_informed: 0.01
loan:
  principal_min: 800.0
  principal_max: 60000.0
  initial_dpd_mean: 55
  initial_dpd_std: 38
actions:
  channel_weights:
    none: 0.2
    sms: 0.25
    app_message: 0.25
    phone: 0.2
    field_visit: 0.1
  max_discount: 0.55
  intensity_confounds_with_friction: false
  exploration:
    epsilon: 0.08
    explore_states:
    - delinquent
    - credito_em_liquidacao
    explore_max_liquidacao_days: 180
oracle:
  # hazard calibrated in development: seeds 9001-9004, 250k borrowers,
  # coupling on, matched to world A's 12-month recovery rate on the same seeds
  # (0.04229 vs 0.04228); see scripts/tmlr_calibrate.py
  target_monthly_recovery_rate: 0.001426
  offer_sensitivity: 3.0
  offer_effect: 1.1
  dpd_effect: -0.018
  liquidacao_age_effect: -0.05
  loan_age_effect: -0.012
  hidden_confounding_strength: 1.0
  noise_std: 0.25
  chargeoff_after_liquidacao_days: 360
  # World B mechanism: stage-dependent channel effects (log-odds, replace CHANNEL_EFFECT).
  # Early delinquency (DPD < 90): every contact channel is a similarly effective prompt.
  # Late stage (DPD >= 90, credit in liquidation): impersonal channels lose effect and
  # personal negotiation gains. Fixed a priori from collections practice,
  # before any world-B result was computed.
  channel_effects:
    none: -0.85
    sms: 0.30
    app_message: 0.30
    phone: 0.30
    field_visit: 0.30
  channel_effects_late:
    none: -0.85
    sms: -0.10
    app_message: 0.00
    phone: 0.45
    field_visit: 0.65
