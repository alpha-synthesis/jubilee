# Revision campaign (2026-11-03) - world A, hidden coupling OFF.
# World A keeps the original mechanisms (generator version 2 streams). Derived from
# configs/grid/cell_06_a10_eps08.yaml: confounding strength 1.0, noise 0.25, eps 0.08,
# and that cell's calibrated hazard (0.001421, calibrated with the coupling on). The
# coupling-on and coupling-off conditions share the hazard, the hidden-factor
# distribution and the outcome mechanism; only the behaviour policy's channel mix differs
# (actions.intensity_confounds_with_friction): on, the channel weights are tilted by
# clip(DPD/180 + payment_friction - 0.4 * contactability, -2, 2), so they read two hidden
# factors and the observed DPD; off, they are the fixed configured weights. The
# incumbent's discount ramp by DPD is the same in both.
seed: 42
population:
  borrowers: 1000000
  loans_per_borrower:
  - 1
  - 1
panel:
  months: 24
demographics:
  age_mean: 42
  age_std: 13
  age_min: 18
  age_max: 78
  gender_weights:
    female: 0.49
    male: 0.49
    non_binary: 0.01
    not_informed: 0.01
loan:
  principal_min: 800.0
  principal_max: 60000.0
  initial_dpd_mean: 55
  initial_dpd_std: 38
actions:
  channel_weights:
    none: 0.2
    sms: 0.25
    app_message: 0.25
    phone: 0.2
    field_visit: 0.1
  max_discount: 0.55
  intensity_confounds_with_friction: false
  exploration:
    epsilon: 0.08
    explore_states:
    - delinquent
    - credito_em_liquidacao
    explore_max_liquidacao_days: 180
oracle:
  target_monthly_recovery_rate: 0.001421
  offer_sensitivity: 3.0
  offer_effect: 1.1
  dpd_effect: -0.018
  liquidacao_age_effect: -0.05
  loan_age_effect: -0.012
  hidden_confounding_strength: 1.0
  noise_std: 0.25
  chargeoff_after_liquidacao_days: 360
