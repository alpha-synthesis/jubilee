# 50k-loan pilot with an ε-exploration floor (OPE counterfactual coverage).
#
# Design (per the policy engine's recommendation, more efficient than "randomize 10%"):
#   * ε-floor (~0.08) across the whole portfolio: follow the confounded incumbent
#     policy almost always, deviate to a uniformly-random (channel, discount) with
#     probability ε. Broad coverage, propensities known by construction, low cost.
#   * Focused where the discount has leverage: delinquent + EARLY credito_em_liquidacao
#     only — not the deep CL tail (charges off regardless, wasted budget).
#
# Confounding & noise are deliberately UNCHANGED from the prior 1M run (strength 0.6,
# noise 0.25): the prior report's gap was counterfactual *coverage*, not noise, and the
# confounding is the realistic challenge the ε-floor exists to overcome — lowering it
# would make the OPE test trivial. The fix is exploration, not weakening the DGP.

seed: 42

population:
  borrowers: 50000
  loans_per_borrower: [1, 1]

panel:
  months: 24

actions:
  intensity_confounds_with_friction: true
  exploration:
    epsilon: 0.08
    explore_states: [delinquent, credito_em_liquidacao]
    explore_max_liquidacao_days: 180   # skip the deep CL tail

oracle:
  target_monthly_recovery_rate: 0.0017
  hidden_confounding_strength: 0.6
  noise_std: 0.25
